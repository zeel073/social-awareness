# Deploys this branch (light-diya: the site that opens with the "Light the
# diya" screen) to GitHub Pages (https://<owner>.github.io/<repo>/).
# Runs on every push to light-diya, or by hand from the Actions tab.
# One-time setup, by a repository admin:
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Settings → Environments → github-pages → Deployment branches and tags:
#      add "light-diya" (a new Pages site only accepts the default branch).
name: Deploy to GitHub Pages

on:
  push:
    branches: [light-diya]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # CI does not run on this branch, so check before deploying.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # ADMIN_KEY unlocks /admin via ?key=… (hash only is shipped in the bundle).
      - name: Require ADMIN_KEY secret
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "Set repository secret ADMIN_KEY before deploying Pages."
            exit 1
          fi
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
